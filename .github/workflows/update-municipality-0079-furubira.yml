name: Update Municipality 0079 furubira RSS

on:
  push:
    paths:
      - "scrape_municipality_0079_furubira.py"
      - ".github/workflows/update-municipality-0079-furubira.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Generate RSS
        run: python scrape_municipality_0079_furubira.py
      - name: Commit RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add municipality-0079-furubira.xml
          git diff --cached --quiet || git commit -m "Update Municipality 0079 furubira RSS"
          git pull --rebase origin main
          git push origin main
