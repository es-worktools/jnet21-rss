name: Check Chuokai Nara

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check page
        run: python check_chuokai_nara.py

      - name: Show relevant HTML
        run: |
          grep -i -n -E "script|iframe|ajax|fetch|json|rss|feed|wp-|news|notice|お知らせ|周知" chuokai-nara-debug.html | head -200 || true
