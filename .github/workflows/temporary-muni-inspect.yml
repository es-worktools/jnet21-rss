name: Temporary municipality listing structure inspection
on:
  push:
    branches: [main]
    paths: [".github/workflows/temporary-muni-inspect.yml"]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests beautifulsoup4 lxml -q
      - run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          urls={'1707':'https://www.town.yoshinogari.lg.jp/news.html','1725':'https://www.city.iki.nagasaki.jp/news.html'}
          for num,url in urls.items():
            r=requests.get(url,timeout=30);r.raise_for_status()
            s=BeautifulSoup(r.content,'lxml')
            print('\n=====',num,'TITLE',s.title.get_text(' ',strip=True),'=====',flush=True)
            print('META',[(m.get('name'),m.get('content')) for m in s.select('meta[name=generator]')],flush=True)
            candidates=[]
            for a in s.select('a[href]'):
              txt=a.get_text(' ',strip=True)
              href=a.get('href') or ''
              if 9<len(txt)<130 and ('html' in href or '/news/' in href or '/soshiki/' in href):
                candidates.append(a)
            print('CANDIDATES',len(candidates),flush=True)
            for a in candidates[:15]:
              par=a
              for _ in range(2):
                if par.parent:par=par.parent
              print('NODE',re.sub(r'\s+',' ',str(par))[:800],flush=True)
            print('NEWS-CONTAINER',[(t.get('class'),t.get('id')) for t in s.select('[class*=news],[class*=list],[class*=info]')[:35]],flush=True)
          PY
