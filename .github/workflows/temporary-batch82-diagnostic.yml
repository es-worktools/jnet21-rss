name: Temporary batch 82 source diagnostic
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-batch82-diagnostic.yml"
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public official sources
        run: |
          python -m pip install requests beautifulsoup4 lxml -q
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          urls={
            '1702':'https://www.city.takeo.lg.jp/information/2026/',
            '1707':'https://www.town.yoshinogari.lg.jp/news.html',
            '1722':'https://www.city.hirado.nagasaki.jp/kurashi/news/',
            '1723':'https://www.city-matsuura.jp/top/',
            '1725':'https://www.city.iki.nagasaki.jp/news.html',
          }
          for id,url in urls.items():
            print('\n===== MUNICIPALITY', id, url, flush=True)
            try:
              r=requests.get(url,timeout=30,headers={'User-Agent':'Mozilla/5.0 (compatible; JNet21-Feed/1.0; official monitoring)'})
              print('HTTP',r.status_code,'URL',r.url,'SIZE',len(r.content),'ENC',r.encoding,flush=True)
              r.raise_for_status()
              soup=BeautifulSoup(r.content,'lxml')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else None)
              rss=[(a.get('href'),a.get_text(' ',strip=True)[:60]) for a in soup.select('a[href],link[href]') if 'rss' in (str(a.get('href',''))+' '+str(a.get('type',''))+' '+a.get_text(' ',strip=True)).lower()]
              print('RSS LINKS',rss[:12])
              date_re=re.compile(r'20\d{2}[年/.-]\s*\d{1,2}[月/.-]\s*\d{1,2}')
              candidates=[]
              for a in soup.select('a[href]'):
                t=a.get_text(' ',strip=True)
                if len(t)<10 or len(t)>140:continue
                p=a
                for level in range(4):
                  p=p.parent
                  if not p:break
                  dt=date_re.search(p.get_text(' ',strip=True)[:350])
                  if dt:
                    candidates.append((str(a.get('href'))[:120],t[:90],dt.group(0),p.name, ' '.join(p.get('class',[])),level+1))
                    break
              print('DATE-LINKS total',len(candidates))
              for row in candidates[:25]: print('ROW',repr(row))
            except Exception as e:print('ERROR',repr(e),flush=True)
          PY
