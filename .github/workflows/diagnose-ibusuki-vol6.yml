name: Ibusuki vol6 verified bid article supplemental
on:
  push:
    branches: ['diagnostics/ibusuki-vol6-20261102']
    paths:
      - '.github/workflows/diagnose-ibusuki-vol6.yml'
      - 'diagnostics/ibusuki-vol6-20261102/probe_ibusuki.py'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check corrected official bid article once only
        run: |
          python - <<'PY'
          import importlib.util, json
          p='diagnostics/ibusuki-vol6-20261102/probe_ibusuki.py'
          spec=importlib.util.spec_from_file_location('probe',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          m.OUT.mkdir(parents=True,exist_ok=True)
          r=m.get('verified_bid_article','Exact official URL verified in search; first run article path was miscopied and is excluded from conclusions','/main/shisei/nyusatsu/nyusatsu/page013759.html')
          (m.OUT/'supplemental-verified-article.json').write_text(json.dumps([r],ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Preserve evidence on diagnostic branch only
        if: always()
        run: |
          test "$(git branch --show-current)" = "diagnostics/ibusuki-vol6-20261102"
          test -f diagnostics/ibusuki-vol6-20261102/results/supplemental-verified-article.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/ibusuki-vol6-20261102/results
          git diff --cached --quiet && exit 0
          git commit -m 'Record verified Ibusuki bid article evidence'
          git push origin HEAD:diagnostics/ibusuki-vol6-20261102
