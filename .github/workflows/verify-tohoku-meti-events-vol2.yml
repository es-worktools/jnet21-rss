name: Verify Tohoku METI events vol.2
on:
  push:
    branches: [verify/tohoku-meti-events-vol2]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Inspect official event sources
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          import re
          import requests
          BASE_URL = 'https://www.tohoku.meti.go.jp/'
          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/139.0.0.0 Safari/537.36"
              ),
              "Accept": (
                  "text/html,application/xhtml+xml,application/xml;q=0.9,"
                  "image/avif,image/webp,image/apng,*/*;q=0.8"
              ),
              "Accept-Language": "ja,en-US;q=0.9,en;q=0.8",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
              "Referer": "https://www.tohoku.meti.go.jp/",
          }
          paths = ['/', '/koho/koshin/archive.html', '/ml_tohoku_news_past_rss.html', '/ml_tohoku_news_past.html',
                   '/ml_tohoku_news_2026.html', '/s_sancle/index_sancle.html',
                   '/2026/261125_2.html', '/2026/261022001.html']
          def inspect(path):
              response = requests.get(urljoin(BASE_URL, path), headers=HEADERS, timeout=20)
              Path('/tmp/tohoku-inspect').mkdir(exist_ok=True)
              Path('/tmp/tohoku-inspect/' + (path.rsplit('/',1)[-1] or 'top.html')).write_bytes(response.content)
              soup = BeautifulSoup(response.content, 'html.parser')
              lines = [f'{path} {response.status_code} {response.url}']
              for tag in soup.find_all(['a','iframe','script'], href=True) + soup.select('iframe[src],script[src]'):
                  href = tag.get('href') or tag.get('src')
                  if 'ml_tohoku_news' in href:
                      lines.append(str(tag)[:450])
              if 'past_rss' in path or '_2026.html' in path:
                  for tag in soup.find_all('dt', limit=2):
                      lines.append(str(tag) + ''.join(str(x) for x in list(tag.find_next_siblings())[:2])[:2200])
                  for tag in soup.select('dt')[:1]:
                      lines.append(str([(p.name, p.get('id'), p.get('class')) for p in tag.parents]))
              if path in paths[-3:]:
                  target = soup.find(id='study') if path == paths[-3] else None
                  if target:
                      lines.append(str(target.parent)[:8500])
                  lines.extend(t for t in soup.stripped_strings if re.search(r'日[時程]|締切|締め切|申込|年[0-9０-９]+月|日開催|受[付け]|終了|対象者',t))
              return '\n'.join(lines)
          for path in paths:
              print(inspect(path))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: official-source-inspection
          path: /tmp/tohoku-inspect
          retention-days: 3
