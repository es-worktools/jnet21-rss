name: Inspect Tohoku METI official listings

on:
  push:
    branches: ["validation/0005-tohoku-meti-vol1-20261127"]
    paths: [".github/workflows/tohoku-meti-vol1-validation.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Compare the two HTML sources referenced by the official site
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          import re
          from urllib.parse import parse_qsl, urlencode, urljoin, urlsplit, urlunsplit
          from xml.etree import ElementTree

          from bs4 import BeautifulSoup
          import requests

          SOURCES = (
              "https://www.tohoku.meti.go.jp/ml_tohoku_news_past_rss.html",
              "https://www.tohoku.meti.go.jp/ml_tohoku_news_2026.html",
          )
          DATE = re.compile(r"20\d{2}年\d{2}月\d{2}日")
          script = ast.parse(Path("scrape_tohoku_meti.py").read_text())
          headers = next(
              ast.literal_eval(node.value)
              for node in script.body if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "HEADERS" for target in node.targets)
          )

          def normalized(url):
              parts = urlsplit(url)
              query = urlencode([(k, v) for k, v in parse_qsl(parts.query, keep_blank_values=True)
                                 if not k.startswith("utm_")])
              return urlunsplit((parts.scheme, parts.netloc, parts.path, query, parts.fragment))

          feed_lookup = {}
          for file in Path(".").glob("*.xml"):
              raw = file.read_bytes()
              if b"www.tohoku.meti.go.jp" not in raw:
                  continue
              try:
                  entries = ElementTree.fromstring(raw).findall("./channel/item")
              except ElementTree.ParseError:
                  continue
              for item in entries:
                  if (link := item.findtext("link")):
                      feed_lookup.setdefault(normalized(link), []).append(file.name)

          for url in SOURCES:
              response = requests.get(url, headers=headers, timeout=15)
              result = {"url": response.url, "status": response.status_code,
                        "content_type": response.headers.get("Content-Type")}
              if response.status_code != 200:
                  print(json.dumps(result, ensure_ascii=False), flush=True)
                  continue
              response.encoding = response.apparent_encoding
              soup = BeautifulSoup(response.text, "html.parser")
              result["declared_feeds"] = [
                  urljoin(response.url, tag["href"]) for tag in soup.select("link[href]")
                  if tag.get("type") in {"application/rss+xml", "application/atom+xml"}
              ]
              date = ""
              dated_rows = []
              for element in soup.find_all(["dt", "a"]):
                  title = element.get_text(" ", strip=True)
                  if element.name == "dt":
                      date = title if DATE.fullmatch(title) else ""
                      continue
                  if not date or not title or not element.has_attr("href"):
                      continue
                  link = normalized(urljoin(response.url, element["href"]))
                  icon = element.find_previous_sibling("img")
                  dated_rows.append([date, title, link, icon.get("alt", "") if icon else "",
                                     feed_lookup.get(link, [])])
              result["items"] = len(dated_rows)
              result["first_date"] = dated_rows[0][0] if dated_rows else ""
              result["last_date"] = dated_rows[-1][0] if dated_rows else ""
              print(json.dumps(result, ensure_ascii=False), flush=True)
              for date, title, url, category, feeds in dated_rows:
                  if date.startswith("2026年11月") or url.endswith("/261022001.html"):
                      print(json.dumps({"date": date, "title": title, "article": url,
                                        "category": category, "repo_feeds": feeds},
                                       ensure_ascii=False), flush=True)
          PY
