name: Probe Municipality Batch93 Sources
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-municipality-batch93.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch official sources
        run: |
          python - <<'PY'
          import urllib.request, json, gzip, base64, concurrent.futures
          targets=[
          ("1929-home","https://www.city.tokyo-nakano.lg.jp/"),
          ("1929-news","https://www.city.tokyo-nakano.lg.jp/allNewsList.html"),
          ("1932-rssinfo","https://www.city.kita.lg.jp/about/rss.html"),
          ("1932-rss","https://www.city.kita.lg.jp/news.rss"),
          ("1932-news","https://www.city.kita.lg.jp/newslist.html")]
          def get(t):
           key,url=t
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=40) as r:
             data=r.read();final=r.url;status=r.status;ctype=r.headers.get("Content-Type")
            if len(data)>1500000:raise RuntimeError("Source unexpectedly large")
            return {"key":key,"url":url,"final_url":final,"status":status,"content_type":ctype,"size":len(data),"gzip_base64":base64.b64encode(gzip.compress(data)).decode()}
           except Exception as e:return {"key":key,"url":url,"error":str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as e:
           for item in e.map(get,targets):print("SOURCE_JSON "+json.dumps(item,ensure_ascii=False))
          PY
