name: Update Mirasapo RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download RSS
        run: |
          curl -L \
            --fail \
            --show-error \
            -o mirasapo.xml \
            "https://mirasapo-plus.go.jp/category/infomation/feed/"

      - name: Commit updated RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirasapo.xml
          git diff --cached --quiet || git commit -m "Update Mirasapo RSS"
          git push
