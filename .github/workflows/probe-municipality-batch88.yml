name: Probe Municipality Batch88 Sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-municipality-batch88.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official sources
        run: |
          python - <<'PYCODE'
          import urllib.request,base64,gzip,json
          urls = ['https://www.town.kadogawa.lg.jp/', 'https://www.town.kadogawa.lg.jp/news/', 'https://www.city.ibusuki.lg.jp/', 'https://www.city.ibusuki.lg.jp/main/info/']
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=40) as r:
                      b=r.read()
                      print('SOURCE_JSON:'+json.dumps({'url':url,'final_url':r.url,'status':r.status,'gzip_base64':base64.b64encode(gzip.compress(b)).decode()}))
              except Exception as e:
                  print('SOURCE_JSON:'+json.dumps({'url':url,'error':str(e)}))
          PYCODE
