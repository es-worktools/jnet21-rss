name: Check JSPS

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check page
        run: python check_jsps.py

      - name: Show relevant HTML
        run: |
          grep -i -n -E "募集案内|イベント|news|notice|api|json|ajax|fetch|script" jsps-debug.html | head -150 || true
