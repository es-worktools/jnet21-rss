name: Validate Sapporo consultation RSS safety test
on:
  push:
    branches: [validation/sapporo-safety-20261125]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c54decd23d5d01307efc27cf9e4ba5b7a95e11dc
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.34.2 beautifulsoup4==4.15.0 PyYAML==6.0.3
      - name: Run all Sapporo safety tests on the current seven-item RSS
        run: python -m unittest discover -s tests/sapporo_consultation -v
      - name: Verify history, idempotency, and a future addition
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          import sys
          from tempfile import TemporaryDirectory
          import unittest
          from unittest.mock import patch

          from publish_sapporo_consultation import build
          from scrape_sapporo_consultation import ET, FILE, TZ, digest, generate, normalize, preserve_history, validate

          sys.path.insert(0, 'tests/sapporo_consultation')
          from test_safety import Safety

          now = datetime(2026, 11, 25, 15, tzinfo=TZ)
          baseline = Path(FILE).read_bytes()
          assert len(validate(ET.fromstring(baseline))) == 7
          with TemporaryDirectory() as output:
              feed = Path(output) / FILE
              preview = build('.', output, now=now)
              preserve_history(baseline, feed.read_bytes())
              assert (preview['added'], preview['total']) == (0, 7), preview
              assert feed.read_bytes() == baseline
              assert generate(baseline, preview['records'], now) == (baseline, 0)
              print('All 7 original items retained byte-for-byte. Same input: 0 additions.')

              records = preview['records']
              changed = next(r for r in records if '小西' in r['label'])
              assert changed['month'] == '2026年12月'
              changed['lines'][0] += '・29日（火曜日）'
              changed['fingerprint'] = digest(normalize(
                  f'2026-12|{changed["label"]}|' + '|'.join(changed['lines'])))
              longer, added = generate(baseline, records, now)
              assert (added, len(validate(ET.fromstring(longer)))) == (1, 8)
              preserve_history(baseline, longer)
              feed.write_bytes(longer)
              with patch('test_safety.ROOT', Path(output)):
                  test = Safety('test_prepared_rss_keeps_original_guids_and_has_no_mock')
                  assert unittest.TextTestRunner(verbosity=2).run(test).wasSuccessful()
              assert generate(longer, records, now) == (longer, 0)
              print('A valid addition increased the count from 7 to 8 and passed the same safety test.')
          assert Path(FILE).read_bytes() == baseline
          PY
      - name: Compare the public RSS with the candidate baseline
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests
          from scrape_sapporo_consultation import ET, FILE, preserve_history, validate

          link = f'https://es-worktools.github.io/jnet21-rss/{FILE}'
          response = requests.get(link, timeout=25)
          response.raise_for_status()
          baseline = Path(FILE).read_bytes()
          preserve_history(baseline, response.content)
          assert len(validate(ET.fromstring(response.content))) == 7
          print('Public RSS contains the same 7 items and GUIDs.')
          PY
