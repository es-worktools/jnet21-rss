name: Diagnose held municipalities 20261027
on:
  push:
    branches: [codex/hold-recheck-261027]
    paths:
      - diagnose_hold_20261027.py
      - .github/workflows/diagnose-hold-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install lxml
      - run: python diagnose_hold_20261027.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hold-diagnostics-20261027
          path: hold-diagnostics/
          retention-days: 30
