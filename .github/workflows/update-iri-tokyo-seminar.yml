name: Update IRI Tokyo Seminar RSS

on:
  schedule:
    - cron: "27 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate RSS
        run: python scrape_iri_tokyo.py

      - name: Commit RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iri-tokyo-seminar.xml
          git diff --cached --quiet || git commit -m "Update IRI Tokyo Seminar RSS"
          git push
