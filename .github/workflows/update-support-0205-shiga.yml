name: Update Shiga supplemental RSS safely

on:
  workflow_dispatch:
    inputs:
      bootstrap_policy:
        description: "First run only: select the approved history policy; later keep existing"
        type: choice
        options: [existing, full-history, archive-summary]
        default: existing
      publish:
        description: "Commit and push a complete validated bundle to main"
        type: boolean
        default: false
  schedule:
    - cron: "17 22 * * *"

permissions:
  contents: write

concurrency:
  group: support-0205-shiga-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests==2.34.2 beautifulsoup4==4.15.0 PyYAML==6.0.3
      - name: Run inherited and production safety tests
        run: |
          python -m unittest discover -s validation -p 'test_shiga_candidate.py' -v
          python -m unittest discover -s tests/shiga_preparation -v
      - name: Generate or publish complete bundle
        env:
          BOOTSTRAP_POLICY: ${{ inputs.bootstrap_policy || 'existing' }}
          SHOULD_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$BOOTSTRAP_POLICY" != existing ]]; then
            args+=(--bootstrap-policy "$BOOTSTRAP_POLICY")
          fi
          if [[ "$SHOULD_PUBLISH" == true ]]; then
            python -m support_shiga.publish "${args[@]}" --publish
          else
            python -m support_shiga.publish "${args[@]}" --output "$RUNNER_TEMP/shiga-preview"
          fi
