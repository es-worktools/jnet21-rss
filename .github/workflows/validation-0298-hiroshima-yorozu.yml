name: Validation 0298 Hiroshima Yorozu HTTP Read-Only
on:
  push:
    branches:
      - validation/0298-hiroshima-yorozu-20261118
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Test structured listing extraction read-only
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,re,collections,json
          from urllib.parse import urlparse,urljoin
          from bs4 import BeautifulSoup
          base='https://www.yorozu-hiroshima.go.jp'
          roots=['/news/','/onestop/news/','/onestop/seminar/','/productivity/news/','/productivity/seminar/']
          output={}
          for root in roots:
              allitems={}
              for path in [root,root+'page/2/']:
                  try:
                      req=urllib.request.Request(base+path,headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req,timeout=12) as res:
                          body=res.read(300000);ct=res.headers.get('Content-Type','')
                      soup=BeautifulSoup(body,'html.parser')
                      links=[]
                      for a in soup.find_all('a',href=True):
                          u=urljoin(base,a['href'])
                          if not u.startswith(base+root):continue
                          sub=u[len(base+root):].split('?')[0].strip('/')
                          if not sub or sub.startswith('page/') or '/' in sub:continue
                          title=a.get_text(' ',strip=True)
                          if len(title)<8:continue
                          parent=a
                          for _ in range(2):
                              if parent.parent:parent=parent.parent
                          label=parent.get_text(' ',strip=True)
                          label=re.sub(r'\s+',' ',label)[:190]
                          links.append((u,title[:130],label))
                          allitems[u]=(title,label)
                      print('LIST',path,'HTTP 200','FOUND',len(links),'UNIQUE',len(set(u for u,_,_ in links)),flush=True)
                      print(' LIST_EXAMPLES',repr(links[:4]),flush=True)
                  except Exception as e:print('LIST',path,'ERROR',type(e).__name__,str(e)[:160],flush=True)
              print('TOTAL',root,'URLS',len(allitems),'SAMPLE',repr(list(allitems.items())[:6]),flush=True)
              output[root]=set(allitems)
          print('OVERLAP',[(x,y,len(output[x]&output[y])) for x in roots for y in roots if x<y],flush=True)
          sample='/news/20261116/'
          try:
              with urllib.request.urlopen(urllib.request.Request(base+sample,headers={'User-Agent':'Mozilla/5.0'}),timeout=10) as resp:
                  soup=BeautifulSoup(resp.read(200000),'html.parser')
              print('ARTICLE',sample,'TITLE',soup.title.get_text(' ',strip=True)[:120],flush=True)
              print('ARTICLE_DATES',[x.get_text(' ',strip=True)[:130] for x in soup.find_all(['time'])][:8],flush=True)
              print('ARTICLE_META',[(m.get('property'),m.get('name'),m.get('content','')[:120]) for m in soup.find_all('meta') if 'date' in str(m).lower() or 'modified' in str(m).lower()][:8],flush=True)
              print('ARTICLE_HEADINGS',[(h.name,h.get_text(' ',strip=True)[:130]) for h in soup.find_all(['h1','h2'])][:8],flush=True)
          except Exception as e:print('ARTICLE_ERROR',type(e).__name__,str(e)[:150],flush=True)
          PY
