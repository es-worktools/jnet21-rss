name: Validation 0298 Hiroshima Yorozu HTTP Read-Only
on:
  push:
    branches:
      - validation/0298-hiroshima-yorozu-20261118
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v7
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Build validation-only RSS in temporary directory
        run: python validation_0298_hiroshima_yrz.py
