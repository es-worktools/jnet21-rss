name: Validation 0298 Hiroshima Yorozu HTTP Read-Only
on:
  push:
    branches:
      - validation/0298-hiroshima-yorozu-20261118
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Validate current listing and RSS alternatives
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,re
          from html.parser import HTMLParser
          from bs4 import BeautifulSoup
          import xml.etree.ElementTree as ET
          base='https://www.yorozu-hiroshima.go.jp'
          paths=[
            '/feed/','/?taxonomy=case_category&term=onestop/feed/',
            '/?feed=rss2','/news/?feed=rss2','/onestop/seminar/?feed=rss2',
            '/wp-json/','/wp-json/wp/v2/types','/wp-json/wp/v2/posts?per_page=5',
            '/wp-json/wp/v2/pages?per_page=5','/wp-sitemap.xml',
            '/news/','/news/page/2/','/onestop/seminar/','/onestop/seminar/page/2/'
          ]
          for path in paths:
              try:
                  req=urllib.request.Request(base+path,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=12) as res:
                      data=res.read(500000);ct=res.headers.get('Content-Type','');final=res.url
                  print('PATH',path,'STATUS 200','LEN',len(data),'CT',ct,'FINAL',final,flush=True)
                  if 'json' in ct:
                      o=json.loads(data)
                      if isinstance(o,list):
                          print(' JSON_LIST',len(o),'SAMPLE',[(x.get('date'),x.get('slug'),x.get('link')) for x in o[:5] if isinstance(x,dict)],flush=True)
                      elif isinstance(o,dict):
                          print(' JSON_ROOT_KEYS',list(o.keys())[:18], 'TYPE_KEYS',list(o.keys())[:18] if '/types' in path else '',flush=True)
                  elif 'xml' in ct or data.lstrip().startswith(b'<?xml'):
                      root=ET.fromstring(data)
                      items=root.findall('.//item');entries=root.findall('.//{http://www.w3.org/2005/Atom}entry')
                      print(' XML_ROOT',root.tag,'ITEMS',len(items),'ATOM_ENTRIES',len(entries),'ITEM_SAMPLE',[(x.findtext('title'),x.findtext('link')) for x in items[:3]],flush=True)
                  elif 'html' in ct:
                      soup=BeautifulSoup(data,'html.parser')
                      title=soup.title.get_text(' ',strip=True) if soup.title else ''
                      print(' TITLE',title[:140],flush=True)
                      for tag in soup.find_all('link',rel='alternate'):
                          print(' ALTERNATE',tag.get('href'),tag.get('type'),flush=True)
                      matches=[(x.get('href'),x.get_text(' ',strip=True)[:90]) for x in soup.select('a[href]') if re.search(r'news/|/seminar|/feed|rss|case_category',x.get('href',''),re.I)]
                      print(' LINKS',len(matches),'SAMPLE',matches[:16],flush=True)
                      for sel in ('article','.news-list','.news_item','.news-item','.list-news','.post','.topics-list','.item-list'):
                          print(' SELECT',sel,len(soup.select(sel)),flush=True)
              except Exception as e:
                  print('PATH',path,'ERROR',type(e).__name__,str(e)[:170],flush=True)
          PY
