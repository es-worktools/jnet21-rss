name: Update Taisyokukin Topics RSS

on:
  schedule:
    - cron: "25 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taisyokukin-topics-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run offline safety tests
        run: python -m unittest discover -s tests -p 'test_taisyokukin*.py' -v

      - name: Generate RSS
        run: python scrape_taisyokukin_topics.py

      - name: Commit RSS
        shell: bash
        run: |
          set -euo pipefail
          python stage_taisyokukin.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Taisyokukin Topics RSS"
          git pull --rebase origin main
          git push origin main

      - name: Save generation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taisyokukin-status
          path: taisyokukin-status.json
          if-no-files-found: ignore
