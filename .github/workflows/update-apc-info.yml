name: Update APC Info RSS

on:
  schedule:
    # 毎日 06:17 JST（21:17 UTC）
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Generate RSS
        run: python scrape_apc_info.py

      - name: Commit RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apc-info.xml
          git diff --cached --quiet || git commit -m "Update APC Info RSS"
          git push
