name: Update JSPS Recruit RSS

on:
  schedule:
    - cron: "50 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate RSS
        run: python scrape_jsps.py

      - name: Commit RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jsps-recruit.xml
          git diff --cached --quiet || git commit -m "Update JSPS Recruit RSS"
          git pull --rebase origin main
          git push origin main
