name: Update Chuokai Kyoto RSS

on:
  schedule:
    - cron: "25 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Generate RSS
        run: python scrape_chuokai_kyoto.py

      - name: Commit RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chuokai-kyoto-news.xml
          git diff --cached --quiet || git commit -m "Update Chuokai Kyoto RSS"
          git push
