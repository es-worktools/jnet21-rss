name: Probe Municipality Batch92 Shibuya Source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-municipality-batch92.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install lxml
      - name: Verify official article headings and anchor target
        run: |
          python - <<'PYCODE'
          import urllib.request,json
          from urllib.parse import urlparse
          from lxml import html
          urls=['https://www.city.shibuya.tokyo.jp/kusei/koho/shibuya-portal/maintenance_202610.html','https://www.city.shibuya.tokyo.jp/bosai/bohan/bohan-torikumi/oshirase.html#h2-hf2b6d02f6b']
          for url in urls:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=40) as r:
                      t=html.fromstring(r.read())
                      fragment=urlparse(url).fragment
                      target=t.xpath('//*[@id=$target]',target=fragment) if fragment else []
                      print('DETAIL_JSON:'+json.dumps({'url':url,'status':r.status,'detail_titles':[' '.join(x.text_content().split()) for x in t.xpath('//h1') if x.text_content().strip()],'fragment':fragment,'fragment_target_count':len(target),'fragment_text':[' '.join(x.text_content().split()) for x in target]},ensure_ascii=False))
              except Exception as e:
                  print('DETAIL_JSON:'+json.dumps({'url':url,'error':str(e)}))
          PYCODE
