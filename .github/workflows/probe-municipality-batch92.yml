name: Probe Municipality Batch92 Shibuya Source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-municipality-batch92.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official source
        run: |
          python - <<'PYCODE'
          import urllib.request,json,base64,gzip
          url='https://www.city.shibuya.tokyo.jp/'
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=40) as r:
                  b=r.read()
                  print('SOURCE_JSON:'+json.dumps({'url':url,'final_url':r.url,'status':r.status,'gzip_base64':base64.b64encode(gzip.compress(b)).decode()}))
          except Exception as e:
              print('SOURCE_JSON:'+json.dumps({'url':url,'error':str(e)}))
          PYCODE
