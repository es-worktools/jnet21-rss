name: Validate B-nest year rollover

on:
  push:
    branches:
      - validation/bnest-year-rollover-20261126

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.34.2 beautifulsoup4==4.15.0
      - name: Run B-nest regression tests
        run: python -m unittest discover -s tests/bnest -v
      - name: Compare official listing with published RSS
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from xml.etree.ElementTree import fromstring

          import requests

          from scrape_bnest import update_rss

          url = "https://es-worktools.github.io/jnet21-rss/bnest-topics.xml"
          response = requests.get(url, timeout=60)
          response.raise_for_status()
          published = response.content
          with TemporaryDirectory() as directory:
              output = Path(directory) / "bnest-topics.xml"
              output.write_bytes(published)
              update_rss(output)
              if output.read_bytes() != published:
                  raise SystemExit("Generated RSS differs from the published RSS")
          items = fromstring(published).findall("./channel/item")
          guids = {item.findtext("guid") for item in items}
          if None in guids or len(guids) != len(items):
              raise SystemExit("Published RSS has missing or duplicated GUIDs")
          print(f"Published RSS matches byte for byte: {len(items)} items and unique GUIDs")
          PY
