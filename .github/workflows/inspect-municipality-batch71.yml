name: Inspect Municipality Batch71
on:
  push:
    branches: [municipality-71-investigation-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install lxml
      - run: python verify_batch71.py
