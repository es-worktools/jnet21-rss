name: Check Chuokai Nara JS

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check JavaScript
        run: python check_chuokai_nara_js.py

      - name: Show base URL
        run: |
          grep -n -E 'id="url"|id="doc_root"' chuokai-nara-debug.html
