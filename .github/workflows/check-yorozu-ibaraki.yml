name: Check Yorozu Ibaraki

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check page
        run: python check_yorozu_ibaraki.py

      - name: Show relevant HTML
        run: |
          grep -i -n -E "seminar|event|セミナー|イベント|api|json" yorozu-ibaraki-debug.html | head -100 || true
