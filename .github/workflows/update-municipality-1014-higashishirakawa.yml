name: Update Municipality 1014 higashishirakawa RSS

on:
  push:
    branches: [main]
    paths:
      - "scrape_municipality_1014_higashishirakawa.py"
      - "rss_1014.py"
      - "config/rss-1014.json"
      - "tests/rss1014/**"
      - ".github/workflows/update-municipality-1014-higashishirakawa.yml"
  workflow_dispatch:
  schedule:
    - cron: "31 16 * * *"

permissions:
  contents: write

concurrency:
  group: municipality-1014-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main and its persistent history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install lxml
      - name: Refresh current main before tests and generation
        run: |
          git pull --ff-only origin main
          git rev-parse HEAD > .git/rss1014-generation-base
      - name: Parsing, retention and failure tests (40 tests, no network)
        run: python -m unittest discover -s tests/rss1014 -p 'test_*.py' -v
      - name: Generate RSS and persistent history using explicit configured mode
        run: python scrape_municipality_1014_higashishirakawa.py
      - name: Commit validated RSS and history together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add municipality-1014-higashishirakawa.xml history/municipality-1014-higashishirakawa.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Municipality 1014 RSS and retained history"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || exit 1
            git diff --exit-code "$(cat .git/rss1014-generation-base)" HEAD -- scrape_municipality_1014_higashishirakawa.py rss_1014.py config/rss-1014.json || exit 1
            if git push origin main; then exit 0; fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          exit 1
