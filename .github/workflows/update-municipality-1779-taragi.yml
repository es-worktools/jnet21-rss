name: Update Municipality 1779 taragi RSS

on:
  push:
    branches: [main]
    paths:
      - "scrape_municipality_1779_taragi.py"
      - ".github/workflows/update-municipality-1779-taragi.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 13 * * *"

permissions:
  contents: write

concurrency:
  group: municipality-1779-taragi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate RSS
        run: python scrape_municipality_1779_taragi.py
      - name: Commit RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add municipality-1779-taragi.xml
          git diff --cached --quiet && exit 0
          git commit -m "Update Municipality 1779 taragi RSS"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || exit 1
            if git push origin main; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          exit 1
