name: Probe Municipality 0124 source
on:
  push:
    paths:
      - ".github/workflows/probe-municipality-0124.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check official HTTPS source
        run: |
          python - <<'PYTHON'
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          s = requests.Session()
          s.mount("https://", HTTPAdapter(max_retries=Retry(total=2, backoff_factor=2, status_forcelist=[429,500,502,503,504])))
          r = s.get("https://www.town.hamatonbetsu.hokkaido.jp/", timeout=40)
          r.raise_for_status()
          print(r.status_code, r.url, len(r.content))
          PYTHON
