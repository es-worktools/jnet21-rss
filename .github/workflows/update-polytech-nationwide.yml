name: Update Polytech Nationwide RSS

on:
  schedule:
    # 毎日 06:47 JST
    - cron: "47 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Generate RSS
        run: python scrape_polytech_nationwide.py

      - name: Commit RSS and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add polytech-nationwide.xml polytech-nationwide-state.json
          git diff --cached --quiet || git commit -m "Update Polytech Nationwide RSS"
          git push
