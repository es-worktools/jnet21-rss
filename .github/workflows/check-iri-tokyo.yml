name: Check IRI Tokyo

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download target JavaScript
        run: |
          curl -fsSL "https://www.iri-tokyo.jp/_nuxt/C-fb5f_d.js" -o iri-search.js
          curl -fsSL "https://www.iri-tokyo.jp/_nuxt/CwKVZny7.js" -o iri-seminar.js
          wc -c iri-search.js iri-seminar.js

      - name: Show search helper
        run: |
          cat iri-search.js

      - name: Show seminar API clues
        run: |
          grep -o -E '.{0,250}(kuroco|rcms-api|fetch|useFetch|\$fetch|topics|content|seminar|entryStartDate|entryEndDate).{0,500}' iri-seminar.js | head -100 || true
