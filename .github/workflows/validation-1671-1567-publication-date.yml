name: Validate Hisayama and Tadotsu RSS publication dates

on:
  push:
    branches: [validation/1671-1567-publication-date-20261127]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install lxml
      - name: Test date boundaries and compare RSS using current official JSON
        run: |
          python tests/municipality_publication_dates/validate.py \
            --base-ref "$(git rev-parse HEAD~2)" \
            --output "$RUNNER_TEMP/municipality-publication-dates"
      - name: Keep validation snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hisayama-tadotsu-rss-preview
          path: ${{ runner.temp }}/municipality-publication-dates/
          if-no-files-found: ignore
