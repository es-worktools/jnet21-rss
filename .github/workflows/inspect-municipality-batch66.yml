name: Inspect Municipality batch66
on:
  push:
    branches: [municipality-66-investigation-20261019]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install lxml
      - run: python verify_public66.py
